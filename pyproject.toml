[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "taggly"
version = "1.0.0"
dependencies = [
  "typer[all]",
  "fastapi",
  "uvicorn",
  "pydantic",
  "pydantic-settings",
  "torch",
  "transformers>=5.13",  # qwen3_5 support; earlier 5.x leak debug prints on load
  "sentence-transformers",
  "keybert",
  "spacy",
  "vaderSentiment",
  "yake",
  "numpy",
  "httpx",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
taggly = "taggly.main:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
