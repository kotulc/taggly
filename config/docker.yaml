# taggly Docker image configuration — copied over config/config.yaml at image build time.
# Generative commands default to the bundled SmolLM2 model so the container works offline
# with no HuggingFace token. Values here override built-in command defaults at startup.

keys:
  model: keybert           # 'yake' or 'keybert'
  language: en
  dedup_lim: 0.9
  dedup_func: seqm         # 'seqm', 'jaro', or 'levs'
  stop_words: english
  use_mmr: false

ents:
  language: en_core_web_lg  # any installed spaCy model name

polar:
  model: vader             # 'vader' or 'blob'

score:
  model: all-minilm        # 'all-minilm', 'bge-base', or 'bge-large'

rank:
  model: all-minilm

topics:
  model: all-minilm

desc:
  model: smollm-135m       # bundled; 'gemma-*' models need a mounted HF cache or HF_TOKEN
  max_tokens: 128

ext:
  model: smollm-135m
  max_tokens: 256
