# taggly system configuration
# Values here override built-in command defaults at startup.
# Only Config fields are supported (system-level settings).
# Per-call options are set via CLI flags or API query params.

keys:
  model: keybert           # 'yake' or 'keybert'
  language: en
  dedup_lim: 0.9
  dedup_func: seqm         # 'seqm', 'jaro', or 'levs'
  stop_words: english
  use_mmr: false

ents:
  language: en_core_web_sm  # any installed spaCy model name

polar:
  model: vader             # 'vader' or 'blob'

score:
  model: all-minilm        # 'all-minilm', 'bge-base', or 'bge-large'

rank:
  model: all-minilm

desc:
  model: smollm-135m       # 'smollm-135m' (ungated), 'gemma-2b', 'gemma-4b', or 'gemma-12b'
  max_tokens: 128

ext:
  model: smollm-135m
  max_tokens: 256
