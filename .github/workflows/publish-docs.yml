name: Publish Docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'mdsite.yaml']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build docs
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -e BASE_PATH=/taggly \
            ghcr.io/kotulc/mdsite:latest

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
